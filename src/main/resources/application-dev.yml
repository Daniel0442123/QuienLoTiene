# Perfil de desarrollo local: levanta PostgreSQL + PostGIS con compose.yaml y el archivo .env
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui

logging:
  level:
    com.quienlotiene: debug

# Sin llaves JWT en el .env se generan unas temporales al arrancar (nunca en prod)
quienlotiene:
  seguridad:
    jwt:
      permitir-llaves-temporales: true
