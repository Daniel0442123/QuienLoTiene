# Perfil de producción (VPS): sin valores por defecto para la base, todo sale de variables de entorno
spring:
  datasource:
    url: ${QLT_DB_URL}
    username: ${QLT_DB_USUARIO}
    password: ${QLT_DB_CLAVE}

server:
  # Caddy pasa la IP real del cliente y el esquema https en X-Forwarded-* (red interna de Docker)
  forward-headers-strategy: native

logging:
  structured:
    format:
      console: ecs
  level:
    root: info
