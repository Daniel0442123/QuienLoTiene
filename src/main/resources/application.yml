# Configuración común a todos los perfiles (DECISIONES-BACKEND, sección 13).
# Los secretos nunca van aquí: salen de variables de entorno (ver .env.ejemplo).
spring:
  application:
    name: quienlotiene
  profiles:
    default: dev

  datasource:
    url: ${QLT_DB_URL:jdbc:postgresql://localhost:5432/quienlotiene}
    username: ${QLT_DB_USUARIO:quienlotiene}
    password: ${QLT_DB_CLAVE:}

  jpa:
    open-in-view: false
    hibernate:
      # La base solo cambia con Flyway (D-11)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Flyway recorre las subcarpetas: db/migration/<modulo>/V<AAAAMMDDHHmm>__<modulo>_<descripcion>.sql (D-12)
    locations: classpath:db/migration

  modulith:
    events:
      # Reenvía los eventos que quedaron sin procesar si la app se reinicia (sección 4.3)
      republish-outstanding-events-on-restart: true

  docker:
    compose:
      enabled: false

# Propiedades propias (DECISIONES-BACKEND, sección 13)
quienlotiene:
  identidad:
    # Versión vigente de la política de tratamiento de datos (HU-005); el registro debe enviar esta misma
    version-politica-datos: "1.0"
    # Duración del token de refresco (HU-003): cuánto dura la sesión sin volver a escribir la frase
    duracion-token-refresco: 7d
    # Llave AES de 32 bytes en Base64 para cifrar los secretos TOTP (HU-004): openssl rand -base64 32
    llave-cifrado-totp: ${QLT_TOTP_LLAVE_CIFRADO:}
    # Administrador que se crea al arrancar si no existe; sin correo no se crea nada (HU-004)
    administrador-inicial:
      nombre: ${QLT_ADMIN_NOMBRE:Administrador}
      correo: ${QLT_ADMIN_CORREO:}
      telefono: ${QLT_ADMIN_TELEFONO:0000000}
      frase-contrasena: ${QLT_ADMIN_FRASE:}
      secreto-totp: ${QLT_ADMIN_SECRETO_TOTP:}
  solicitudes:
    # Valores aprobados en la Fase 9 (DECISIONES-BACKEND, sección 13)
    vigencia: 30m
    maximo-por-hora: 10
    radio-inicial-en-metros: 3000
  seguridad:
    jwt:
      emisor: quienlotiene
      vigencia-token-acceso: 15m
      llave-privada: ${QLT_JWT_LLAVE_PRIVADA:}
      llave-publica: ${QLT_JWT_LLAVE_PUBLICA:}
      kid: ${QLT_JWT_KID:llave-1}
      # Solo dev, test y demo generan llaves temporales si faltan; en prod la app no arranca sin ellas
      permitir-llaves-temporales: false
    cors:
      origenes-permitidos: ${QLT_CORS_ORIGENES:http://localhost:5173}

# El id de correlación de cada petición sale en todas las líneas de log (DECISIONES-BACKEND, sección 14)
logging:
  pattern:
    correlation: "[%X{idCorrelacion:-}] "

server:
  error:
    include-stacktrace: never
    include-message: never

# Swagger UI solo fuera de producción (D-17); el perfil dev lo habilita
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
