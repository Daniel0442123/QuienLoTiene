# Perfil de la demo: además de las migraciones carga los datos de ejemplo de db/demo (R__datos_demo_<modulo>.sql)
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/demo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui

# Sin llaves JWT en el .env se generan unas temporales al arrancar (nunca en prod)
quienlotiene:
  seguridad:
    jwt:
      permitir-llaves-temporales: true
