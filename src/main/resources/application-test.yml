# Perfil de pruebas de integración (*IT): la base la entrega Testcontainers con @ServiceConnection
spring:
  docker:
    compose:
      enabled: false

logging:
  level:
    com.quienlotiene: info

# Sin llaves JWT en el .env se generan unas temporales al arrancar (nunca en prod)
quienlotiene:
  seguridad:
    jwt:
      permitir-llaves-temporales: true
