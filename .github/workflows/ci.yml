# Integración continua (DECISIONES-BACKEND sección 18, estrategia de pruebas).
# Corre en cada pull request hacia main y en cada push a main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilar, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # validate: formato (Spotless) · test: unitarias, Modulith, ArchUnit y JaCoCo >= 70 %
      # integration-test: *IT con Testcontainers + PostGIS (el runner trae Docker)
      - name: Construir y probar
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          retention-days: 14

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

  seguridad:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # SpotBugs + FindSecBugs y SBOM CycloneDX (perfil seguridad del pom.xml)
      - name: SpotBugs, FindSecBugs y SBOM
        run: ./mvnw -B -Pseguridad -DskipTests verify

      # Vulnerabilidades en dependencias (RNF-011): falla con críticas o altas que tengan arreglo
      - name: Trivy (dependencias)
        run: >
          docker run --rm -v "$PWD:/proyecto" -w /proyecto aquasec/trivy:0.58.1
          fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .

      # Secretos en el repositorio (RNF-030)
      - name: Gitleaks (secretos)
        run: >
          docker run --rm -v "$PWD:/proyecto" zricethezav/gitleaks:v8.21.2
          detect --source /proyecto --redact --verbose

      - name: Publicar SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.*
          retention-days: 30
